<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-image: linear-gradient(
          red,
          orange,
          yellow,
          green,
          blue,
          purple
        );
      }
      * {
        box-sizing: border-box;
      }
      .backagain {
        background-color: bisque;
        padding: 5px;
      }
      /* Add padding to containers */
      .container {
        padding: 16px;
        background-color: white;
      }

      /* Full-width input fields */
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 15px;
        margin: 5px 0 22px 0;
        display: inline-block;
        border: none;
        background: #f1f1f1;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        background-color: #ddd;
        outline: none;
      }

      /* Overwrite default styles of hr */
      hr {
        border: 1px solid #f1f1f1;
        margin-bottom: 25px;
      }

      /* Set a style for the submit button */
      .registerbtn {
        background-image: linear-gradient(to right, red, yellow, red);
        color: black;
        padding: 16px 20px;
        margin: 8px 0;
        border: none;
        cursor: pointer;
        width: 100%;
        opacity: 0.9;
        font-size: 20;
      }

      .registerbtn:hover {
        opacity: 1;
      }

      /* Add a blue text color to links */
      a {
        color: dodgerblue;
      }

      /* Set a grey background color and center the text of the "sign in" section */
      .signin {
        background-color: #f1f1f1;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <form action="/action_page.php">
      <div class="container">
        <h1>Register</h1>
        <p>
          Please fill in this form to create an account. Work in progress(Do not
          try!)
        </p>
        <hr />

        <label for="email"><b>Email</b></label>
        <input
          type="text"
          placeholder="Enter Email"
          name="email"
          id="email"
          required
        />

        <label for="psw"><b>Password</b></label>
        <input
          type="password"
          placeholder="Enter Password"
          name="psw"
          id="psw"
          required
        />

        <label for="psw-repeat"><b>Repeat Password</b></label>
        <input
          type="password"
          placeholder="Repeat Password"
          name="psw-repeat"
          id="psw-repeat"
          required
        />
        <hr />
        <p>
          By creating an account you agree to our
          <a href="terms.html">Terms & Privacy</a>.
        </p>

        <button type="submit" class="registerbtn" onclick="savename()">
          Register
        </button>
      </div>

      <div class="container signin">
        <p>
          Already have an account?
          <a href="https://ohqy2.csb.app/login.html">Sign in</a>
        </p>
      </div>
      <div class="backagain">
        <p>
          Wanna go back to the homepage?
          <a href="https://ohqy2.csb.app/index.html">Back</a>
        </p>
      </div>
    </form>
    <script>
      function savename() {
        var input = document.getElementById("email").value;
        alert(input);
      }
    </script>
  </body>
</html>
